<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Claims Hive</title>
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="shortcut icon" href="favicon/favicon.ico">

    <!-- Link CSS -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components/layout.css">
    <link rel="stylesheet" href="components/DataTable/dataTable.css">
    <link rel="stylesheet" href="admin-table.css">
    
    <!-- Font Awesome CDN (for icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="data-table-container"></div>
    
    <script type="module">
        // Check if user is logged in
        const token = localStorage.getItem('claims_hive_token');
        const user = JSON.parse(localStorage.getItem('claims_hive_user') || '{}');
        
        // If no token, redirect to login page
        if (!token) {
            window.location.href = 'login.html';
            // The redirect will stop execution
        }
        
        // Verify token with the server
        fetch('/api/auth/me', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
        .then(response => {
            if (!response.ok) {
                // Token is invalid, clear it and redirect to login
                localStorage.removeItem('claims_hive_token');
                localStorage.removeItem('claims_hive_user');
                window.location.href = 'login.html';
                throw new Error('Invalid token');
            }
            return response.json();
        })
        .then(userData => {
            console.log('User verified:', userData);
            // Update user data in localStorage
            localStorage.setItem('claims_hive_user', JSON.stringify(userData));
        })
        .catch(error => {
            console.error('Error verifying token:', error);
        });
        
        import Layout from './components/layout.js';
        import AdminTable from './admin-table.js';
        
        // Create layout
        const layout = new Layout({
            title: 'Claims Hive',
            activeMenuItem: 'menu-users',
            isAdminMode: true
        });
        
        // Add content header
        layout.addContentHeader('Users', [
            {
                targetMenuId: 'menu-companies',
                icon: 'fa-solid fa-briefcase',
                text: 'Companies'
            },
            {
                targetMenuId: 'menu-roles',
                icon: 'fa-solid fa-user-tag',
                text: 'Roles'
            },
            {
                targetMenuId: 'menu-claim-types',
                icon: 'fa-solid fa-puzzle-piece',
                text: 'Claim Types'
            }
        ]);
        
        // Fetch companies for dropdown
        async function fetchCompanies() {
            try {
                const response = await fetch('/api/company', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch companies: ${response.status} ${response.statusText}`);
                }
                
                const companies = await response.json();
                return companies.map(company => ({
                    value: company.company_id,
                    text: company.name
                }));
            } catch (error) {
                console.error('Error fetching companies:', error);
                return [];
            }
        }
        
        // Define columns
        const columns = [
            {
                field: 'user_id',
                title: 'ID',
                type: 'number',
                sortable: true,
                editable: false
            },
            {
                field: 'email',
                title: 'Email',
                type: 'email',
                sortable: true
            },
            {
                field: 'first',
                title: 'First Name',
                type: 'text',
                sortable: true
            },
            {
                field: 'last',
                title: 'Last Name',
                type: 'text',
                sortable: true
            },
            {
                field: 'company_name',
                title: 'Company',
                type: 'text',
                sortable: true,
                editable: false
            },
            {
                field: 'company_id',
                title: 'Company',
                type: 'select',
                sortable: false,
                options: await fetchCompanies()
            },
            {
                field: 'role',
                title: 'Role',
                type: 'select',
                sortable: true,
                options: [
                    { value: 'admin', text: 'Admin' },
                    { value: 'affiliate_user', text: 'Affiliate User' },
                    { value: 'buyer_user', text: 'Buyer User' }
                ]
            },
            {
                field: 'created',
                title: 'Created',
                type: 'date',
                sortable: true,
                editable: false,
                formatOptions: {
                    format: 'medium'
                }
            },
            {
                field: 'updated',
                title: 'Updated',
                type: 'date',
                sortable: true,
                editable: false,
                formatOptions: {
                    format: 'medium'
                }
            }
        ];
        
        // Initialize admin table
        const adminTable = new AdminTable({
            tableName: 'user',
            title: 'User',
            columns: columns,
            containerId: 'data-table-container',
            apiEndpoint: '/api/user'
        });
    </script>
</body>
</html>
