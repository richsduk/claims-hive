version: '3'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # Mount the application code
      - .:/usr/src/app 
      # Use an anonymous volume to persist node_modules installed in the container
      - /usr/src/app/node_modules # <-- Restored this anonymous volume
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=claims_hive
      - DB_USER=claims_hive_user
      - DB_PASSWORD=claims_hive_password
      - JWT_SECRET=claims_hive_jwt_secret_key_change_in_production
      - JWT_EXPIRES_IN=24h
      - PORT=5000
      - NODE_ENV=development

  db:
    image: postgres:14
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/2-seeds.sql
    environment:
      - POSTGRES_DB=claims_hive
      - POSTGRES_USER=claims_hive_user
      - POSTGRES_PASSWORD=claims_hive_password
    restart: unless-stopped

volumes:
  postgres_data:
